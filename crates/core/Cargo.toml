[package]
name = "claude-core"
version.workspace = true
edition.workspace = true
description = "Shared model, tool, session and persistence engine for CLI and Desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls", "blocking"], default-features = false }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
once_cell = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
async-trait = "0.1"
walkdir = "2"
glob = "0.3"
regex = "1"
open = "5"
urlencoding = "2"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
enigo = "0.2"
base64 = "0.22"
ring = "0.17"
windows = { version = "0.58", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
cron = "0.12"
diffy = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
prometheus = "0.13"
serde_yaml = "0.9"
scraper = "0.24"

tempfile = "3"
semver = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
